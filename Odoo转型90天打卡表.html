<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odoo 转型 90 天打卡表</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --border:#e5e8ec; --text:#1f2933; --muted:#6b7480;
    --accent:#2563eb; --accent-soft:#e8effd; --day:#0e9f6e; --day-soft:#e6f6f0;
    --night:#7c3aed; --night-soft:#f1ebfd; --done:#94a3b8; --warn:#d97706;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);padding:24px 16px 80px}
  .wrap{max-width:860px;margin:0 auto}
  header.top{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-bottom:18px}
  h1{font-size:20px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .stats{display:flex;gap:12px;flex-wrap:wrap}
  .stat{flex:1;min-width:120px;background:var(--bg);border-radius:10px;padding:10px 14px;text-align:center}
  .stat .num{font-size:22px;font-weight:700;color:var(--accent)}
  .stat .lab{font-size:12px;color:var(--muted);margin-top:2px}
  .bar{height:8px;background:var(--border);border-radius:4px;margin-top:14px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#0e9f6e);width:0%;transition:width .3s}
  .phase-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-bottom:8px;font-weight:600}
  .p1{background:#e8effd;color:#2563eb}.p2{background:#fdf1e0;color:#d97706}.p3{background:#e6f6f0;color:#0e9f6e}
  .week{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:14px}
  .week h2{font-size:16px;margin-bottom:2px}
  .week .goal{font-size:13px;color:var(--muted);margin-bottom:12px}
  .day{border-top:1px dashed var(--border);padding:12px 0}
  .day-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .day-head .d{font-weight:600;font-size:14px}
  .day-head .rate{font-size:12px;color:var(--muted)}
  .day-head .allbtn{margin-left:auto;font-size:12px;color:var(--accent);background:var(--accent-soft);border:none;border-radius:6px;padding:3px 10px;cursor:pointer}
  .day-head .allbtn.off{background:var(--bg);color:var(--muted)}
  .task{display:flex;align-items:flex-start;gap:8px;padding:5px 8px;border-radius:8px;cursor:pointer;transition:background .15s}
  .task:hover{background:var(--bg)}
  .task input{margin-top:3px;accent-color:var(--accent);width:15px;height:15px;flex-shrink:0}
  .slot{font-size:11px;padding:1px 7px;border-radius:5px;flex-shrink:0;margin-top:1px;font-weight:600}
  .slot.D{background:var(--day-soft);color:var(--day)}
  .slot.N{background:var(--night-soft);color:var(--night)}
  .task .t{font-size:14px;line-height:1.5}
  .task.done .t{color:var(--done);text-decoration:line-through}
  .toolbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;justify-content:center}
  .toolbar button{font-size:13px;padding:7px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
  .toolbar button:hover{background:var(--bg)}
  .today-btn{position:fixed;right:20px;bottom:60px;background:var(--accent)!important;color:#fff!important;border:none!important;border-radius:999px!important;padding:12px 20px!important;font-size:14px!important;box-shadow:0 4px 14px rgba(37,99,235,.35)}
  .holiday .t{color:var(--warn);font-weight:600}
  .note-box{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;min-height:34px;margin-top:6px;background:var(--bg);color:var(--text)}
  .note-box:focus{outline:none;border-color:var(--accent);background:#fff}
  .report-btn{font-size:12px;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:3px 10px;cursor:pointer;margin-left:8px}
  .report-btn:hover{opacity:.85}
  .note-label{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center}
  .note{font-size:12px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:12px;line-height:1.6}
</style>
</head>

      <div class="stat"><div class="num" id="s-week">-</div><div class="lab">本周</div></div>

const KEY="odoo90_checkin_v1";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function tid(w,d,t){return `w${w}d${d}t${t}`}

function render(){
  const app=document.getElementById("app");
  let html="",total=0,done=0;
  PLAN.forEach((wk,wi)=>{
    html+=`<div class="week" id="week${wi}"><span class="phase-tag p${wk.p}">${wk.pt}</span><h2>${wk.title}</h2><div class="goal">${wk.goal} · ${wk.range}</div>`;
    wk.days.forEach((day,di)=>{
      const isHol=!!day.holiday;
      let dTotal=day.t.length, dDone=0;
      day.t.forEach((_,ti)=>{total++;if(state[tid(wi,di,ti)]){done++;dDone++}});
      const rate=`${dDone}/${dTotal}`;
      html+=`<div class="day${isHol?' holiday':''}" id="d${wi}-${di}"><div class="day-head"><span class="d">${day.d}</span><span class="rate">${isHol?'':rate}</span>${isHol?'':`<button class="allbtn ${dDone===dTotal?'off':''}" onclick="toggleDay(${wi},${di},this)">全选</button>`}</div>`;
      day.t.forEach((tk,ti)=>{
        const [txt,slot]=tk, ck=!!state[tid(wi,di,ti)];
        html+=`<div class="task${ck?' done':''}" onclick="toggle(${wi},${di},${ti})"><input type="checkbox" ${ck?'checked':''} onclick="event.stopPropagation();toggle(${wi},${di},${ti})"><span class="slot ${slot}">${slot==='D'?'白天':slot==='N'?'晚上':'休'}</span><span class="t">${txt}</span></div>`;
      });
      if(!isHol){
        const noteVal=(state[nid(wi,di)]||"").replace(/"/g,"&quot;").replace(/</g,"&lt;");
        html+=`<div class="note-label">📝 日报备注<button class="report-btn" onclick="copyReport(${wi},${di})">📋 复制日报</button></div>
        <textarea class="note-box" placeholder="今天具体做了什么、卡在哪、有什么发现……（自动保存，随 checkin.json 同步）" oninput="saveNote(${wi},${di},this.value)">${noteVal}</textarea>`;
      }
      html+=`</div>`;
    });
    html+=`</div>`;
  });
  app.innerHTML=html;
  // stats
  document.getElementById("s-total").textContent=total;
  document.getElementById("s-done").textContent=done;
  document.getElementById("s-pct").textContent=Math.round(done/total*100)+"%";
  document.getElementById("bar").style.width=(done/total*100)+"%";
  document.getElementById("s-streak").textContent=calcStreak();
  // current week
  const now=new Date();const start=new Date(2026,10,2);
  const weekNo=Math.min(13,Math.max(1,Math.floor((now-start)/604800000/1)+1));
  document.getElementById("s-week").textContent=weekNo+"/13 周";
}
function toggle(w,d,t){state[tid(w,d,t)]=!state[tid(w,d,t)];if(!state[tid(w,d,t)])delete state[tid(w,d,t)];save();render()}
function toggleDay(w,di,btn){
  const day=PLAN[w].days[di];const allDone=day.t.every((_,ti)=>state[tid(w,di,ti)]);
  day.t.forEach((_,ti)=>{if(allDone)delete state[tid(w,di,ti)];else state[tid(w,di,ti)]=true});
  save();render();
}
function nid(w,d){return `w${w}d${d}note`}
function saveNote(w,d,val){state[nid(w,d)]=val;save()} // 只存不渲染，避免打字时丢焦点
function copyReport(w,d){
  const wk=PLAN[w],day=wk.days[d];
  const lines=[`【90天打卡日报】${day.d} · ${wk.title}`,""];
  const doneList=day.t.filter((_,ti)=>state[tid(w,d,ti)]);
  const undoneList=day.t.filter((_,ti)=>!state[tid(w,d,ti)]);
  if(doneList.length){lines.push("✅ 已完成：");doneList.forEach(([t,s])=>lines.push(`- [${s==='D'?'白天':'晚上'}] ${t}`))}
  if(undoneList.length){lines.push("⬜ 未完成：");undoneList.forEach(([t,s])=>lines.push(`- [${s==='D'?'白天':'晚上'}] ${t}`))}
  const note=state[nid(w,d)]||"";
  if(note){lines.push("","📝 备注：",note)}
  const txt=lines.join("\n");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>alert("日报已复制，可直接粘贴给我")).catch(()=>fallbackCopy(txt));
  }else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);
  ta.select();document.execCommand("copy");document.body.removeChild(ta);alert("日报已复制，可直接粘贴给我");
}
function calcStreak(){ // 从 11/02 起算，工作日当天全部完成记 1 天，周末跳过
  const start=new Date(2026,10,2);let streak=0;const cur=new Date();
  for(let dt=new Date(start);dt<=cur;dt.setDate(dt.getDate()+1)){
    const wd=dt.getDay();if(wd===0||wd===6)continue;
    const wIdx=Math.floor((dt-start)/(7*86400000));
    if(wIdx>=PLAN.length)continue;
    const wk=PLAN[wIdx];
    const dayIdx=[1,2,3,4,5].indexOf(wd);
    if(!wk.days[dayIdx])continue;
    const day=wk.days[dayIdx];
    if(day.t.length&&day.t.every((_,ti)=>state[tid(wIdx,dayIdx,ti)]))streak++;
  }
  return streak;
}
function scrollToday(){
  const now=new Date(),start=new Date(2026,10,2);
  const wIdx=Math.floor((now-start)/(7*86400000));
  if(wIdx<0||wIdx>=PLAN.length)return alert("今天不在 90 天范围内（11/02 前）");
  const el=document.getElementById("week"+wIdx)||document.getElementById("week0");
  el.scrollIntoView({behavior:"smooth"});
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="checkin.json";a.click();
}
function importData(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{try{state=JSON.parse(e.target.result);save();render();alert("导入成功")}catch{alert("文件格式不对")}};
  r.readAsText(f);input.value="";
}
function resetData(){if(confirm("确定清空所有打卡记录？此操作不可恢复（建议先导出备份）")){state={};save();render()}}
render();
</script>
